<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Learn the OCS weeks 1-5 study guide a few pieces at a time.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Phase Up Recall</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a learning path through the week 1–5 study guide. Each skill is a node on a vertical rail,
   grouped by week; a lesson is a short run of exercises (learn a few, build them, recall with fading
   hints) with a GO / NO-GO bar at the bottom, the way a lane grader calls it. */
:root {
  --bg: #ECEEE8; --surface: #FAFBF7; --ink: #161A15; --muted: #586053; --line: #CDD2C5; --rule: #1E231C;
  --band: #1E231C; --band-ink: #F4F5EF; --gold: #F2C200; --gold-ink: #6F5300; --gold-soft: #FAF0C2; --on-gold: #161A15;
  --ok: #1C6B34; --ok-bg: #E0EEE2; --warn: #855600; --warn-bg: #F7ECCB; --bad: #AD2A20; --bad-bg: #F5DFDB;
  --f-display: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
  --f-body: 'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F110E; --surface: #181B16; --ink: #E4E7DE; --muted: #9AA293; --line: #30352D; --rule: #5F6659;
    --band: #2A2F26; --band-ink: #EDEFE8; --gold: #F2C230; --gold-ink: #F2C230; --gold-soft: #332B10; --on-gold: #161A15;
    --ok: #74C98C; --ok-bg: #15301D; --warn: #E8BC5E; --warn-bg: #342910; --bad: #FF8F84; --bad-bg: #3A1815;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F110E; --surface: #181B16; --ink: #E4E7DE; --muted: #9AA293; --line: #30352D; --rule: #5F6659;
  --band: #2A2F26; --band-ink: #EDEFE8; --gold: #F2C230; --gold-ink: #F2C230; --gold-soft: #332B10; --on-gold: #161A15;
  --ok: #74C98C; --ok-bg: #15301D; --warn: #E8BC5E; --warn-bg: #342910; --bad: #FF8F84; --bad-bg: #3A1815;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--f-body); -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
button { font: inherit; color: inherit; touch-action: manipulation; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--band); color: var(--band-ink); }
.topin { display: flex; align-items: center; gap: 8px 16px; min-height: 52px; flex-wrap: wrap; }
.brand { font: 700 21px/1 var(--f-display); letter-spacing: .05em; text-transform: uppercase; background: none; border: 0; padding: 0; cursor: pointer; color: var(--band-ink); }
.brand b { color: var(--gold); font-weight: 700; }
.tabs { display: flex; gap: 2px; margin-left: auto; }
.tabs button { font: 600 15px/1 var(--f-display); letter-spacing: .07em; text-transform: uppercase; color: var(--band-ink); background: none; border: 0; border-bottom: 3px solid transparent; padding: 17px 10px 14px; cursor: pointer; opacity: .78; }
.tabs button[aria-current="page"] { border-bottom-color: var(--gold); opacity: 1; }
.tabs .badge { display: inline-block; min-width: 1.5em; margin-left: 4px; padding: 2px 5px; background: var(--gold); color: var(--on-gold); font: 600 11px/1 var(--f-mono); border-radius: 9px; text-align: center; }
.tabs .badge:empty { display: none; }
body.lesson-on .top { display: none; }
@media (max-width: 420px) { .brand { font-size: 18px; } .tabs button { padding-inline: 8px; } }

main { padding-block: 20px 80px; }
h1 { font: 700 clamp(30px, 5.4vw, 44px)/1 var(--f-display); text-transform: uppercase; letter-spacing: .01em; margin: 4px 0 10px; text-wrap: balance; }
.eyebrow { font: 600 12px/1.2 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--gold-ink); margin: 0; }
.sub { color: var(--muted); max-width: 62ch; margin: 0; }

/* buttons */
.btn { font: 600 15px/1 var(--f-display); letter-spacing: .07em; text-transform: uppercase; min-height: 46px; padding: 13px 18px; border: 1.5px solid var(--rule); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn:hover { background: var(--gold-soft); }
.btn.pri { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.pri:hover { box-shadow: inset 0 -3px 0 var(--gold); background: var(--ink); }
.btn.gold { background: var(--gold); color: var(--on-gold); border-color: var(--gold); }
.btn.ghost { border-color: transparent; background: transparent; padding-inline: 10px; }
.btn.ghost:hover { background: var(--gold-soft); }
.btn.sm { min-height: 38px; padding: 9px 12px; font-size: 14px; }
.btn:disabled { opacity: .45; cursor: default; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.link { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 13px; }

/* path */
.phead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px 32px; align-items: end; padding-bottom: 18px; border-bottom: 1.5px solid var(--rule); }
.stats { display: flex; gap: 22px; }
.stats div { display: grid; gap: 2px; }
.stats b { font: 700 34px/.95 var(--f-display); }
.stats span { font: 500 12px/1.2 var(--f-mono); color: var(--muted); }
.cta { display: flex; flex-wrap: wrap; gap: 10px; padding-block: 18px 4px; }
.weeks { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px 40px; align-items: start; }
.week { margin-top: 22px; min-width: 0; }
.week h3 { display: flex; align-items: center; gap: 10px; font: 700 15px/1 var(--f-display); text-transform: uppercase; letter-spacing: .12em; margin: 0 0 12px; color: var(--muted); }
.week h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.path { position: relative; list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.path::before { content: ""; position: absolute; left: 26px; top: 14px; bottom: 14px; width: 3px; background: var(--line); }
.node { position: relative; display: flex; align-items: center; gap: 14px; width: 100%; padding: 4px 8px 4px 0; border: 0; background: none; text-align: left; cursor: pointer; }
.ring { flex: none; width: 55px; height: 55px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--gold) calc(var(--p, 0) * 1turn), var(--line) 0); }
.ring.full { background: var(--ok); }
.core { width: 43px; height: 43px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1.5px solid var(--rule); font: 700 18px/1 var(--f-display); }
.ring.full .core { background: var(--ok); color: var(--surface); border-color: var(--ok); }
.node:hover .core { background: var(--gold-soft); }
.node.next .core { background: var(--gold); color: var(--on-gold); border-color: var(--gold); }
.nt { display: grid; gap: 3px; min-width: 0; }
.nt b { font: 700 17px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .03em; }
.nt small { font: 500 12px/1.3 var(--f-mono); color: var(--muted); }
.nt small .due { color: var(--gold-ink); }
.foot { margin-top: 36px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; color: var(--muted); font-size: 13px; }
@media (max-width: 640px) { .phead { grid-template-columns: 1fr; } .cta .btn { flex: 1 1 100%; } }

/* skill page */
.skill { max-width: 720px; margin: 0 auto; display: grid; gap: 18px; }
.memo { margin: 0; font: 600 21px/1.4 var(--f-body); text-wrap: balance; }
.memo .mw b { color: var(--gold-ink); text-decoration: underline; text-underline-offset: 3px; }
.memo .mw.on { background: var(--gold-soft); box-shadow: 0 0 0 3px var(--gold-soft); }
.memo-l { font: 600 11px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.levels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.lvl { display: grid; gap: 4px; align-content: start; text-align: left; padding: 12px; border: 1.5px solid var(--rule); background: var(--surface); cursor: pointer; min-width: 0; }
.lvl b { font: 700 18px/1 var(--f-display); text-transform: uppercase; letter-spacing: .04em; }
.lvl small { color: var(--muted); font-size: 13px; line-height: 1.35; }
.lvl .ln { font: 600 11px/1 var(--f-mono); color: var(--muted); letter-spacing: .1em; }
.lvl.done { background: var(--ok-bg); border-color: var(--ok); }
.lvl.done .ln { color: var(--ok); }
.lvl.next { background: var(--gold-soft); border-color: var(--gold-ink); }
@media (max-width: 520px) { .levels { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1.5px solid var(--rule); }
.chead { display: flex; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; background: var(--band); color: var(--band-ink); padding: 9px 12px; }
.chead h2 { margin: 0; font: 700 18px/1.1 var(--f-display); letter-spacing: .05em; text-transform: uppercase; }
.chead .cnt { margin-left: auto; font: 500 12px/1 var(--f-mono); opacity: .75; }
.tag { font: 600 12px/1 var(--f-mono); letter-spacing: .1em; color: var(--gold); }
.note { margin: 0; padding: 9px 12px; border-top: 1px dashed var(--line); font-size: 13.5px; color: var(--muted); }
.hook { display: grid; gap: 6px; }
.hook label { font: 700 13px/1 var(--f-display); text-transform: uppercase; letter-spacing: .1em; }
.hook textarea, .custom textarea { width: 100%; font: 400 16px/1.5 var(--f-body); color: var(--ink); background: var(--surface); border: 1.5px solid var(--rule); border-radius: 0; padding: 10px 12px; resize: vertical; outline: none; }
.hook small, .custom small { color: var(--muted); font-size: 13px; }
.row2 { display: flex; flex-wrap: wrap; gap: 8px; }

/* content rows (study + intro) */
.irows { display: grid; }
.irow { display: grid; grid-template-columns: 2.5rem minmax(0, 1fr); border-top: 1px solid var(--line); }
.irows > .irow:first-child, .irows > .grp:first-child { border-top: 0; }
.num { display: flex; align-items: center; justify-content: center; font: 600 13px/1 var(--f-mono); color: var(--muted); border-right: 1px solid var(--line); padding: 4px 2px; text-align: center; }
.itx { padding: 10px 12px; font-weight: 600; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.itx .fl { color: var(--gold-ink); text-decoration: underline; text-underline-offset: 3px; }
.mchip { font: 600 12px/1 var(--f-mono); padding: 4px 7px; background: var(--gold-soft); color: var(--gold-ink); }
.subl { flex-basis: 100%; margin: 0; padding: 0 0 0 16px; font-weight: 400; color: var(--muted); font-size: 14px; }
.grp { font: 700 12px/1 var(--f-display); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); background: var(--bg); padding: 7px 12px; border-top: 1px solid var(--line); }
.trow3 { display: grid; grid-template-columns: minmax(7rem, .8fr) 1fr 1fr; border-top: 1px solid var(--line); }
.trow3 > * { padding: 9px 12px; min-width: 0; }
.trow3 > * + * { border-left: 1px solid var(--line); }
.trow3 .cue { font: 700 14px/1.2 var(--f-display); text-transform: uppercase; letter-spacing: .04em; }
.trow3 .nm { font-weight: 600; }
.trow3 .nm small { display: none; }
.irows > .trow3:first-child { border-top: 0; }
@media (max-width: 560px) {
  .trow3 { grid-template-columns: 1fr; }
  .trow3 > * + * { border-left: 0; padding-top: 0; }
  .trow3 .cue { padding-bottom: 4px; color: var(--muted); }
  .trow3 .nm small { display: inline; font: 600 11px/1 var(--f-mono); color: var(--muted); margin-right: 6px; }
  .trow3 .dash { display: none; }
}
.ptext { margin: 0; padding: 12px; font-size: 17px; line-height: 1.75; }
.ptext span { display: block; }

/* lesson */
.lesson { max-width: 660px; margin: 0 auto; padding-bottom: 170px; }
.ltop { display: flex; align-items: center; gap: 12px; padding-block: 4px 18px; }
.lx { width: 44px; height: 44px; border: 0; background: none; font: 400 30px/1 var(--f-body); color: var(--muted); cursor: pointer; }
.lbar { flex: 1; height: 12px; background: var(--line); overflow: hidden; border-radius: 6px; }
.lbar i { display: block; height: 100%; width: 0; background: var(--ok); border-radius: 6px; }
.lcount { font-size: 13px; color: var(--muted); }
.lbody { display: grid; gap: 16px; }
.lq { margin: 0; font: 700 clamp(24px, 4.6vw, 32px)/1.12 var(--f-display); text-transform: uppercase; letter-spacing: .02em; text-wrap: balance; }
.lq.plain { text-transform: none; font: 600 22px/1.3 var(--f-body); letter-spacing: 0; }
.ctx { margin: 0; padding: 10px 12px; border-left: 3px solid var(--line); color: var(--muted); font-size: 15px; }
.ctx b { color: var(--ink); }
.lact { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.hint { margin: 0; font: 500 15px/1.4 var(--f-mono); letter-spacing: .06em; color: var(--gold-ink); }
.ain { width: 100%; font: 500 18px/1.3 var(--f-body); color: var(--ink); background: var(--surface); border: 1.5px solid var(--rule); border-radius: 0; padding: 13px 14px; outline: none; }
.ain:focus { border-color: var(--gold-ink); box-shadow: inset 0 -3px 0 var(--gold); }
.ain::placeholder { color: var(--muted); letter-spacing: .06em; }
.ain.shake, .chip.shake { animation: shake .32s; border-color: var(--bad); }
.say { margin: 0; font-size: 14px; color: var(--muted); }
.say:empty { display: none; }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }

/* chips */
.pool { display: flex; flex-wrap: wrap; gap: 9px; }
.chip { font: 500 16px/1.25 var(--f-body); padding: 10px 14px; min-height: 46px; border: 1.5px solid var(--rule); background: var(--surface); box-shadow: 0 3px 0 var(--rule); cursor: pointer; text-align: left; }
.chip:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--rule); }
.chip.used { visibility: hidden; }
.slots { list-style: none; margin: 0; padding: 0; display: grid; border: 1.5px solid var(--rule); background: var(--surface); }
.slots li { display: grid; grid-template-columns: 2.5rem minmax(0, 1fr); border-top: 1px solid var(--line); min-height: 44px; }
.slots li:first-child { border-top: 0; }
.slots .sv { padding: 10px 12px; font-weight: 600; }
.slots li.on .sv { box-shadow: inset 3px 0 0 var(--gold); }
.slots li.ok { background: var(--ok-bg); }
.built { margin: 0; min-height: 3.4em; padding: 12px; border: 1.5px solid var(--rule); background: var(--surface); font-size: 18px; line-height: 1.6; }
.built .gap { display: inline-block; width: 2.2em; border-bottom: 2px solid var(--line); margin: 0 .15em; }
.sortcard { padding: 26px 16px; border: 1.5px solid var(--rule); background: var(--surface); text-align: center; font: 700 30px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .03em; }
.sortcard small { display: block; font: 500 12px/1 var(--f-mono); color: var(--muted); letter-spacing: .08em; margin-bottom: 10px; }
.buckets { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.buckets .btn.right { background: var(--ok-bg); border-color: var(--ok); }
.buckets .btn.wrong { background: var(--bad-bg); border-color: var(--bad); }

/* recite list */
.rlist { list-style: none; margin: 0; padding: 0; display: grid; border: 1.5px solid var(--rule); background: var(--surface); }
.rlist li { display: grid; grid-template-columns: 2.5rem minmax(0, 1fr); border-top: 1px solid var(--line); min-height: 42px; }
.rlist li:first-child { border-top: 0; }
.rlist .sv { padding: 9px 12px; font-weight: 600; }
.rlist li.ok { background: var(--ok-bg); } .rlist li.ok .sv { color: var(--ok); }
.rlist li.close { background: var(--warn-bg); }
.rlist li.bad { background: var(--bad-bg); } .rlist li.bad .sv { color: var(--bad); }
.rlist li.cur { box-shadow: inset 3px 0 0 var(--gold); background: var(--gold-soft); }
.rin { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; }
.rin .num { border: 0; font-size: 16px; color: var(--ink); min-width: 2.5rem; }

/* first-letter typing */
.ltext { padding: 14px; border: 1.5px solid var(--rule); background: var(--surface); font-size: 18px; line-height: 2.05; }
.ltext p { margin: 0; }
.ltext p + p { margin-top: 4px; }
.ltext .lab { font: 600 12px/1 var(--f-mono); color: var(--muted); margin-right: 8px; }
.wd { display: inline-block; color: transparent; border-bottom: 2px solid var(--line); margin: 0 .1em; line-height: 1.5; }
.wd.ghost { color: var(--muted); opacity: .5; }
.wd.cur { border-bottom-color: var(--gold); background: var(--gold-soft); }
.wd.ok, .wd.free { color: var(--ink); border-bottom-color: transparent; opacity: 1; }
.wd.slip { color: var(--warn); border-bottom-color: transparent; opacity: 1; }
.wd.bad { color: var(--bad); border-bottom-color: transparent; font-weight: 700; opacity: 1; }
.wd.flash { background: var(--bad-bg); border-bottom-color: var(--bad); }
.kbd { display: none; gap: 6px; user-select: none; -webkit-user-select: none; }
.kbd div { display: flex; gap: 5px; justify-content: center; }
.kbd button { flex: 1; max-width: 44px; min-height: 48px; border: 1.5px solid var(--rule); background: var(--surface); box-shadow: 0 2px 0 var(--rule); font: 600 18px/1 var(--f-body); text-transform: uppercase; cursor: pointer; padding: 0; }
.kbd button:active { background: var(--gold-soft); transform: translateY(1px); }
@media (pointer: coarse) { .kbd { display: grid; } .lesson.typing { padding-bottom: 60px; } }

/* feedback bar */
.fbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; border-top: 2px solid var(--ok); background: var(--ok-bg); padding-block: 14px calc(14px + env(safe-area-inset-bottom, 0px)); }
.fbar.no { border-top-color: var(--bad); background: var(--bad-bg); }
.fin { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; max-width: 660px; }
.fmsg { flex: 1 1 260px; display: grid; gap: 4px; min-width: 0; }
.fgo { font: 700 26px/1 var(--f-display); letter-spacing: .08em; color: var(--ok); }
.fbar.no .fgo { color: var(--bad); }
.ftext { font-size: 15px; line-height: 1.4; }
.ftext b { font-weight: 700; }
.fin .btn { flex: 0 0 auto; min-width: 160px; }
@media (max-width: 520px) { .fin .btn { flex: 1 1 100%; } }

/* lesson done */
.done { text-align: center; display: grid; gap: 14px; justify-items: center; padding-top: 30px; }
.stamp { display: inline-block; font: 700 72px/1 var(--f-display); letter-spacing: .1em; color: var(--ok); border: 6px solid currentColor; padding: 4px 22px 2px; margin-bottom: 18px; transform: rotate(-7deg); }
.stamp.retrain { color: var(--warn); font-size: 52px; }
.dstats { display: flex; gap: 26px; justify-content: center; flex-wrap: wrap; }
.dstats div { display: grid; gap: 2px; }
.dstats b { font: 700 32px/1 var(--f-display); }
.dstats span { font: 500 12px/1 var(--f-mono); color: var(--muted); }
.done .lact { justify-content: center; }
.weak { list-style: none; margin: 0; padding: 0; text-align: left; width: 100%; max-width: 520px; border: 1.5px solid var(--rule); background: var(--surface); }
.weak li { padding: 8px 12px; border-top: 1px solid var(--line); font-size: 14px; }
.weak li:first-child { border-top: 0; }
.weak small { color: var(--muted); display: block; font-size: 12px; }


/* sheet */
.sheetgrid { columns: 2 380px; column-gap: 16px; }
.sheetgrid .card { break-inside: avoid; margin-bottom: 16px; }
.wk { column-span: all; font: 700 15px/1 var(--f-display); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 18px 0 10px; }

@media (prefers-reduced-motion: no-preference) {
  .btn, .chip, .node .core, .lvl { transition: background-color .15s ease, box-shadow .15s ease, transform .1s ease; }
  .lbar i { transition: width .35s ease; }
  .stamp { animation: stamp .45s cubic-bezier(.2, 1.4, .4, 1) both; }
  .fbar { animation: rise .18s ease-out both; }
}
@keyframes stamp { from { transform: rotate(-7deg) scale(1.8); opacity: 0; } to { transform: rotate(-7deg) scale(1); opacity: 1; } }
@keyframes rise { from { transform: translateY(100%); } to { transform: none; } }
</style>

<header class="top">
  <div class="wrap topin">
    <button class="brand" data-go="path">Phase Up <b>Recall</b></button>

<script>
(function () {

  const SECTIONS = [

    { id: 'cos', week: 2, title: 'Classes of Supply', unit: 'classes', labels: ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'],

    { id: 'patrol', week: 3, title: 'Principles of Patrolling', unit: 'principles', memo: 'Please Remember Smart Choices Count',
      items: ['Planning', 'Recon|reconnaissance', 'Security', 'Control', 'Common Sense'] },
    { id: 'opord', week: 3, title: '5 Paragraph OPORD', unit: 'paragraphs', memo: 'See My Execution, Sustain Command',
      items: ['Situation', 'Mission', 'Execution', 'Sustainment', 'Command and Signal'] },
    { id: 'mettc', week: 3, title: 'Mission Variables', tag: 'METT-TC',
      items: ['Mission', 'Enemy', 'Terrain and Weather', 'Troops|troops and support available|troops and support', 'Time|time available', 'Civil Considerations'] },
    { id: 'off', week: 3, title: 'Characteristics of the Offense', tag: 'ACTS', items: ['Audacity', 'Concentration', 'Tempo', 'Surprise'] },
    { id: 'def', week: 3, title: 'Characteristics of the Defense', note: 'From the cadre sheet.',
      items: ['Disruption', 'Flexibility', 'Mass and Concentration', 'Preparation', 'Security'] },
    { id: 'oe', week: 3, title: 'Operational Environment', type: 'text',
      note: 'The study guide says “a composite … of that platoon or squad”; the cadre sheet says “the composite … of a platoon or squad”. Either is accepted.',
      text: '{The/A} composite of conditions, circumstances, and influences | affecting the employment of {a/that} platoon or squad.' },

    { id: 'opvar', week: 4, title: 'Operational Variables', tag: 'PMESII-PT',
      items: ['Political', 'Military', 'Economic', 'Social', 'Information', 'Infrastructure', 'Physical Environment', 'Time'] },

    { id: 'pmc', week: 5, title: 'Principles of Mission Command', unit: 'principles', memo: 'Competent Soldiers Master Command, Discipline, and Risk',
      memoMap: ['Competent', 'Soldiers', 'Master', 'Command', null, 'Discipline', 'Risk'],
      note: 'Mission Orders has no word in the sentence: it comes right after Commander’s Intent (intent, then orders).',
      items: ['Competence', 'Shared Understanding', 'Mutual Trust', 'Commander’s Intent', 'Mission Orders', 'Disciplined Initiative|disciplined initiatives', 'Risk Acceptance'] },
    { id: 'alrm', week: 5, title: 'Core Leader Competencies & Attributes', groups: [[0, 'Competencies'], [3, 'Attributes']], tag: 'LDA · CPI',
      items: ['Leads', 'Develops', 'Achieves', 'Character', 'Presence', 'Intellect'] }
  ];
  const KEY = 'phaseup-recall-v2';
  const INT = [0, 10 * 60e3, 60 * 60e3, 5 * 3600e3, 24 * 3600e3, 72 * 3600e3];
  const LEVELS = [['Learn', 'Meet it a few at a time, build it, type along'], ['Practice', 'Recall it with hints that fade'], ['Master', 'From memory, no hints. Spelling doesn’t count']];

  const $ = (s, r) => (r || document).querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const split = s => String(s).split('|').map(x => x.trim());
  const fine = matchMedia('(pointer: fine)').matches;
  const mmss = ms => { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const mix = a => { if (a.length < 2) return a.slice(); for (let t = 0; t < 12; t++) { const b = shuffle(a); if (b.some((x, i) => x !== a[i])) return b; } return a.slice().reverse(); };
  function chunks(arr, size) {
    const n = Math.max(1, Math.ceil(arr.length / size)), out = []; let s = 0;
    for (let k = 0; k < n; k++) { const len = Math.round((arr.length - s) / (n - k)); out.push(arr.slice(s, s + len)); s += len; }
    return out;
  }

  /* ---------- progress, kept in this browser ---------- */
  let P = (() => { try { const v = JSON.parse(localStorage.getItem(KEY)); if (v && v.items) return v; } catch (e) {} return { items: {}, lv: {}, xp: 0, days: [], hooks: {}, custom: {} }; })();
  ['lv', 'hooks', 'custom'].forEach(k => { P[k] = P[k] || {}; });
  P.days = P.days || [];
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} };
  const seen = k => { if (!P.items[k]) P.items[k] = { b: 0, d: Date.now(), n: 0, c: 0 }; };
  // v: 1 = from memory, 0.5 = with help, 0 = missed. Boxes space the next review further out.
  function grade(k, v) {
    const s = P.items[k] || (P.items[k] = { b: 0, d: 0, n: 0, c: 0 });
    s.n++;
    if (v >= 1) { s.c++; s.b = Math.min(s.b + 1, INT.length - 1); } else if (v > 0) s.b = Math.max(s.b, 1); else s.b = 0;
    s.d = Date.now() + INT[s.b];
  }
  const isDue = k => P.items[k] && P.items[k].d <= Date.now();
  const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  function streak() {
    const set = new Set(P.days), d = new Date(); let n = 0;
    const key = x => x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
    if (!set.has(key(d))) d.setDate(d.getDate() - 1);
    while (set.has(key(d))) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }

  /* ---------- matching ---------- */
  const norm = s => String(s || '').toLowerCase().replace(/&/g, ' and ').replace(/['’‘`]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
  const STOP = new Set(['the', 'a', 'an', 'of', 'and', 'to', 'for', 'in']);
  const core = n => n.split(' ').filter(w => !STOP.has(w)).join('');
  function lev(a, b) {
    if (a === b) return 0;
    if (!a.length || !b.length) return a.length || b.length;
    let prev = Array.from({ length: b.length + 1 }, (_, j) => j), cur = new Array(b.length + 1);
    for (let i = 1; i <= a.length; i++) {
      cur[0] = i;
      for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      [prev, cur] = [cur, prev];
    }
    return prev[b.length];
  }
  // The board is oral, so spelling never counts: a typed word fits if it is near the word or starts it,
  // and one word may be missing from answers of three words or more.
  function wordFits(t, e) {
    if (t === e) return true;
    if (e.length <= 3) return t.startsWith(e) && t.length <= e.length + 1;
    if (t.length >= 4 && (e.startsWith(t) || t.startsWith(e))) return true;
    return lev(t, e) <= Math.max(1, Math.floor(e.length / 3));
  }
  function fit(v, a) {
    const t = norm(v), n = norm(a); if (!t || !n) return 0;
    if (t === n || core(t) === core(n)) return 1;
    if (lev(core(t), core(n)) <= Math.floor(core(n).length / 4)) return 0.9;
    const tw = t.split(' ').filter(w => !STOP.has(w)), ew = n.split(' ').filter(w => !STOP.has(w)), used = new Set();
    let hit = 0;
    ew.forEach(e => { const k = tw.findIndex((w, i) => !used.has(i) && wordFits(w, e)); if (k > -1) { used.add(k); hit++; } });
    return ew.length && hit >= ew.length - (ew.length >= 3 ? 1 : 0) ? Math.max(0.05, 0.5 + 0.4 * hit / ew.length - 0.05 * (tw.length - used.size)) : 0;
  }
  // 'ok' = word for word, 'close' = near enough (counts the same), null = wrong, or it fits another item better.
  function matchItem(v, accepts, others) {
    const best = acc => Math.max(0, ...acc.map(a => fit(v, a))), mine = best(accepts);
    if (!mine) return null;
    if (mine === 1) return 'ok';
    return others && others.some(o => best(o) >= mine) ? null : 'close';
  }
  const RANKS = [['sergeant major of the army', 'sma'], ['command sergeant major', 'csm'], ['sergeant major', 'sgm'], ['first sergeant', '1sg'], ['1st sergeant', '1sg'],
    ['sergeant first class', 'sfc'], ['staff sergeant', 'ssg'], ['lieutenant general', 'ltg'], ['lt gen', 'ltg'], ['major general', 'mg'], ['maj gen', 'mg'],
    ['brigadier general', 'bg'], ['brig gen', 'bg'], ['lieutenant colonel', 'ltc'], ['lt col', 'ltc'], ['first lieutenant', '1lt'], ['1st lieutenant', '1lt'],
    ['the honorable', 'hon'], ['honorable', 'hon'], ['colonel', 'col'], ['captain', 'cpt'], ['capt', 'cpt'], ['general', 'gen'], ['potus', 'president']];
  function normName(s) { let n = ' ' + norm(s) + ' '; for (const [f, a] of RANKS) n = n.split(' ' + f + ' ').join(' ' + a + ' '); return n.trim(); }
  // Names: the last name decides, spelled roughly; rank and first name are optional.
  function matchName(v, ans, others) {
    const t = normName(v).split(' ').filter(Boolean); if (!t.length) return null;
    const cands = t.concat(t.slice(1).map((w, i) => t[i] + w));
    const dist = a => { const key = normName(a).split(' ').pop(); return Math.min(...cands.map(w => lev(w, key))); };
    const d = dist(ans);
    if (d > Math.max(1, Math.floor(normName(ans).split(' ').pop().length / 3))) return null;
    if (others && others.some(o => dist(o) < d)) return null;
    return { s: d ? 'close' : 'ok' };
  }
  const initials = t => t.split(/\s+/).map(w => w.replace(/^([^A-Za-z0-9]*)([A-Za-z0-9])([A-Za-z0-9’'\-]*)(.*)$/, (m, a, b, c, d) => a + b + '_'.repeat(Math.min(c.length, 9)) + d)).join(' ');
  const nameHint = t => { const w = t.split(' '); return w[0] + ' ' + initials(w.slice(1).join(' ')); };
  const firstUp = t => esc(t).replace(/(^|[\s(/“"-])([A-Za-z0-9])/g, '$1<span class="fl">$2</span>');

  /* ---------- build the model ---------- */
  function parseLine(raw) {
    const toks = raw.split(/\s+/).filter(Boolean).map(w => {
      const m = w.match(/^(.*?)\{([^}]+)\}(.*)$/);
      const alts = m ? m[2].split('/') : [w], word = m ? m[1] + alts[0] + m[3] : w;
      const ks = alts.map(a => norm(a).replace(/ /g, '')[0]).filter(Boolean);
      return { w: word, k: ks };
    });
    return { toks, text: toks.map(t => t.w).join(' ') };
  }
  function prep(sec) {
    sec.type = sec.type || 'list';
    if (sec.type === 'custom') { const t = (P.custom[sec.id] || '').trim(); sec.ready = !!t; sec.text = t ? t.split(/\n+/).map(s => s.trim()).filter(Boolean).join(' | ') : ''; }
    if (sec.type === 'list' && !sec.prepped) {
      sec.items = sec.items.map(it => {
        const [t, sub] = Array.isArray(it) ? it : [it, null], a = split(t);
        return { text: a[0], accepts: a, sub: sub ? sub.map(s => { const b = split(s); return { text: b[0], accepts: b }; }) : null };
      });
      if (sec.memo) {
        const words = sec.memo.split(/\s+/).map(w => w.replace(/[^A-Za-z]/g, '')).filter(w => w && w !== 'and');
        sec.memoWords = sec.memoMap || (words.length === sec.items.length ? words : null);
      }
    }
    if (sec.type === 'table' && !sec.prepped) sec.rows = sec.rows.map(r => { const a = split(r[0]); return { cue: a[0], accepts: a, cells: r.slice(1) }; });
    sec.prepped = true;
    sec.lines = (sec.type === 'text' || sec.ready) ? split(sec.text).map(parseLine) : [];
    sec.keys = sec.type === 'list' ? sec.items.flatMap((it, i) => it.sub ? [`${sec.id}:${i}`, `${sec.id}:${i}s`] : [`${sec.id}:${i}`])
      : sec.type === 'table' ? sec.rows.flatMap((r, ri) => r.cells.map((c, ci) => c ? `${sec.id}:${ri}.${ci}` : null).filter(Boolean))
      : sec.lines.map((_, i) => `${sec.id}:${i}`);
  }
  SECTIONS.forEach(prep);
  const BY = Object.fromEntries(SECTIONS.map(s => [s.id, s]));
  const usable = s => s.type !== 'custom' || s.ready;
  const label = (sec, i) => sec.labels ? sec.labels[i] : String(i + 1);
  const groupOf = (sec, i) => sec.groups.filter(g => g[0] <= i).pop()[1];
  const isText = s => s.type === 'text' || s.type === 'custom';
  const countLabel = s => isText(s) ? `${s.lines.length} lines` : s.type === 'table' ? `${s.keys.length} names` : `${s.items.length} ${s.unit || 'items'}`;
  const lvOf = s => P.lv[s.id] || 0;
  const dueOf = s => s.keys.filter(isDue).length;

  /* ---------- content blocks (study + intro) ---------- */
  function memoHTML(sec, idx) {
    if (!sec.memo) return '';
    const on = new Set((idx || []).map(i => sec.memoWords && sec.memoWords[i]).filter(Boolean));
    return `<div><p class="memo-l">Memory sentence</p><p class="memo">${sec.memo.split(/\s+/).map(w => {
      const bare = w.replace(/[^A-Za-z]/g, '');
      return `<span class="mw${on.has(bare) ? ' on' : ''}"><b>${esc(w[0])}</b>${esc(w.slice(1))}</span>`;
    }).join(' ')}</p></div>`;
  }
  function rowsHTML(sec, idx) {
    if (sec.type === 'table') return (idx || sec.rows.map((_, i) => i)).map(ri => {
      const r = sec.rows[ri];
      return `<div class="trow3"><div class="cue">${esc(r.cue)}</div>${r.cells.map((c, ci) => c ? `<div class="nm"><small>${esc(sec.head[ci + 1])}</small>${esc(c)}</div>` : '<div class="nm dash" aria-hidden="true">—</div>').join('')}</div>`;
    }).join('');
    if (isText(sec)) return `<p class="ptext">${(idx || sec.lines.map((_, i) => i)).map(i => `<span>${esc(sec.lines[i].text)}</span>`).join('')}</p>`;
    return (idx || sec.items.map((_, i) => i)).map(i => {
      const it = sec.items[i], g = sec.groups && sec.groups.find(x => x[0] === i), mw = sec.memoWords && sec.memoWords[i];
      return (g ? `<div class="grp">${esc(g[1])}</div>` : '') + `<div class="irow"><span class="num">${label(sec, i)}</span><div class="itx">${mw ? `<span class="mchip">${esc(mw)}</span>` : ''}<span>${firstUp(it.text)}</span>${it.sub ? `<ul class="subl">${it.sub.map(s => `<li>${esc(s.text)}</li>`).join('')}</ul>` : ''}</div></div>`;
    }).join('');
  }

  /* ---------- exercises ---------- */
  function hintFor(sec, i) { const mw = sec.memoWords && sec.memoWords[i]; return (mw ? `“${mw}” · ` : '') + initials(sec.items[i].text); }
  function askItem(sec, i, mode, show) {
    const it = sec.items[i], key = `${sec.id}:${i}`;
    const cls = j => [sec.labels[j], String(j + 1), 'class ' + sec.labels[j], 'class ' + (j + 1)];
    if (mode === 'rev') return { t: 'ask', sec, key, q: `${it.text} is which class?`, accepts: cls(i), others: sec.labels.map((_, j) => j).filter(j => j !== i).map(cls), answer: `Class ${sec.labels[i]}`, hint: `It is #${i + 1} in the list` };
    if (mode === 'memo' && !(sec.memoWords && sec.memoWords[i])) mode = 'num';
    const base = { t: 'ask', sec, key, accepts: it.accepts, others: sec.items.filter((_, j) => j !== i).map(x => x.accepts), answer: it.text, hint: hintFor(sec, i), show };
    if (mode === 'num') return { ...base, q: sec.labels ? `What is Class ${sec.labels[i]}?` : `What is #${i + 1}?` };
    if (mode === 'memo') return { ...base, q: `“${sec.memoWords[i]}” stands for …`, memoIdx: i };
    return { ...base, q: i ? 'What comes next?' : 'What comes first?', ctx: i ? `<b>${label(sec, i - 1)}.</b> ${esc(sec.items[i - 1].text)}  →` : '' };
  }
  function askCell(sec, r, c, show) {
    const row = sec.rows[r], ans = row.cells[c];
    const q = r < 4 ? (c ? `Who is the NCO alongside the ${row.cue}?` : `Who is the ${row.cue}?`) : `Who is the ${c ? 'NCO' : 'commander'} of ${row.cue}?`;
    return { t: 'ask', sec, key: `${sec.id}:${r}.${c}`, q, name: true, answer: ans, others: sec.rows.flatMap(x => x.cells).filter(x => x && x !== ans), hint: nameHint(ans), show };
  }
  function askPos(sec, r, c) {
    const row = sec.rows[r], ans = row.cells[c];
    return { t: 'ask', sec, key: `${sec.id}:${r}.${c}`, q: `${ans} is the ${c ? 'NCO' : 'commander'} of …`, accepts: row.accepts, others: sec.rows.filter((_, j) => j !== r).map(x => x.accepts), answer: row.cue, hint: initials(row.cue) };
  }
  const listRows = (sec, idx, show) => idx.map(i => ({ key: `${sec.id}:${i}`, text: sec.items[i].text, accepts: sec.items[i].accepts, label: label(sec, i), hint: show ? hintFor(sec, i) : initials(sec.items[i].text), shown: show }));
  const subEx = (sec, i, show) => ({ t: 'recite', sec, key: `${sec.id}:${i}s`, title: `Under “${sec.items[i].text}”`,
    rows: sec.items[i].sub.map((s, j) => ({ text: s.text, accepts: s.accepts, label: String(j + 1), hint: initials(s.text), shown: show })) });
  const orderList = (sec, idx) => ({ t: 'order', sec, title: idx.length === sec.items.length ? 'Tap them in order' : `Tap ${label(sec, idx[0])}–${label(sec, idx[idx.length - 1])} in order`, items: idx.map(i => ({ text: sec.items[i].text, label: label(sec, i) })) });
  const orderPos = (sec, idx) => ({ t: 'order', sec, title: 'Put the chain in order, top to bottom', items: idx.map(ri => ({ text: sec.rows[ri].cue, label: String(ri + 1) })) });

  function genList(sec, lv) {
    const n = sec.items.length, all = sec.items.map((_, i) => i), subs = all.filter(i => sec.items[i].sub), out = [];
    if (lv === 1) {
      let learned = [];
      chunks(all, n <= 4 ? n : n <= 6 ? 3 : 4).forEach(c => {
        out.push({ t: 'intro', sec, idx: c });
        learned = learned.concat(c);
        if (learned.length > 1) out.push(orderList(sec, learned));
        c.forEach(i => out.push(askItem(sec, i, 'next', true)));
      });
      if (sec.groups) out.push({ t: 'sort', sec });
      subs.forEach(i => out.push(subEx(sec, i, true)));
      out.push({ t: 'recite', sec, title: 'Now the whole list', rows: listRows(sec, all, true) });
    } else if (lv === 2) {
      out.push(orderList(sec, all));
      shuffle(all).forEach((i, k) => out.push(askItem(sec, i, k % 3 === 0 ? 'memo' : k % 3 === 1 ? 'next' : 'num', false)));

        <div class="kbd" aria-hidden="true">${['qwertyuiop', 'asdfghjkl', 'zxcvbnm'].map(r => `<div>${[...r].map(c => `<button data-k="${c}" tabindex="-1">${c}</button>`).join('')}</div>`).join('')}</div>
        <div class="lact"><button class="btn ghost" data-a="skip">Show this word</button></div>`;
      const els = host.querySelectorAll('[data-s]'); let i = 0, tries = 0, fin = false;
      const stat = slots.map(() => 'ok');
      const mark = () => { els.forEach((e, k) => e.classList.toggle('cur', k === i)); if (els[i]) els[i].scrollIntoView({ block: 'nearest' }); };
      const next = st => {
        stat[i] = st; els[i].classList.remove('cur', 'ghost', 'flash'); els[i].classList.add(st);
        i++; tries = 0;
        if (i < slots.length) { mark(); return; }
        fin = true;
        const bad = stat.filter(x => x === 'bad').length, slip = stat.filter(x => x === 'slip').length, first = stat.filter(x => x === 'ok').length;
        const keys = ex.lis.map(li => { const st = stat.filter((_, k) => slots[k].li === li); return [`${s.id}:${li}`, st.includes('bad') ? 0 : st.includes('slip') ? 0.5 : (ex.ghost ? 0.5 : 1)]; });
        const ok = bad === 0 && slip <= Math.max(1, Math.round(slots.length * 0.1));
        done({ ok, msg: `${first} of ${slots.length} words right first time${bad ? `, ${bad} shown` : ''}.`, keys });
      };
      const press = c => {
        if (fin || !slots[i]) return;
        if (slots[i].t.k.includes(c)) { next(tries ? 'slip' : 'ok'); return; }
        tries++; els[i].classList.remove('flash'); void els[i].offsetWidth; els[i].classList.add('flash');
        if (tries >= 2) next('bad');
      };
      host.onclick = e => { const k = e.target.closest('[data-k]'); if (k) { press(k.dataset.k); return; } if (e.target.closest('[data-a="skip"]') && !fin) next('bad'); };
      L.key = e => { if (e.metaKey || e.ctrlKey || e.altKey) return; if (/^[a-z0-9]$/i.test(e.key)) { e.preventDefault(); press(e.key.toLowerCase()); } };
      mark();
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    }
  };

  /* ---------- views ---------- */
  function setTab(v) {
    const tab = v === 'skill' ? 'path' : v;
    document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.go === tab ? 'page' : 'false'));
    const n = SECTIONS.filter(usable).reduce((a, s) => a + dueOf(s), 0);
    $('#due-badge').textContent = n ? String(n) : '';
  }
  function go(v, arg) {
    L = null;
    document.body.classList.remove('lesson-on');
    setTab(v);
    if (v === 'skill' && BY[arg]) viewSkill(BY[arg]);
    else if (v === 'review') viewReview();
    else if (v === 'sheet') viewSheet();
    else viewPath();
    window.scrollTo(0, 0);
  }
  document.addEventListener('click', e => {
    const g = e.target.closest('[data-go]'); if (g) { go(g.dataset.go, g.dataset.arg); return; }
    const s = e.target.closest('[data-skill]'); if (s) go('skill', s.dataset.skill);
  });
  const nextUp = () => SECTIONS.find(s => usable(s) && lvOf(s) < 3);

  function viewPath() {
    const up = nextUp(), due = SECTIONS.filter(usable).reduce((a, s) => a + dueOf(s), 0);
    const mastered = SECTIONS.filter(s => lvOf(s) === 3).length;
    app.innerHTML = `<section class="phead"><div><p class="eyebrow">Phase up · weeks 1–5 study guide</p><h1>Learn it a few pieces at a time</h1>
      <p class="sub">Each skill has three short levels: learn it with its memory sentence, practice with hints that fade, then master it from memory. Missed items come back in Review. Spelling never counts: the board is oral.</p></div>
      <div class="stats"><div><b class="mono">${streak()}</b><span>day streak</span></div><div><b class="mono">${P.xp || 0}</b><span>XP</span></div><div><b class="mono">${mastered}/${SECTIONS.length}</b><span>mastered</span></div></div></section>
      <div class="cta">${up ? `<button class="btn gold" id="go-next">Continue: ${esc(up.title)} · Level ${lvOf(up) + 1}</button>` : ''}<button class="btn" data-go="review">Review${due ? ` · ${due} due` : ''}</button><button class="btn" data-go="sheet">Read the sheet</button></div>
      <div class="weeks">${[1, 2, 3, 4, 5].map(w => `<section class="week"><h3>Week ${w}</h3><ol class="path">${SECTIONS.filter(s => s.week === w).map(s => {
        const lv = lvOf(s), d = dueOf(s), ready = usable(s);
        const state = !ready ? 'Add the words to start' : lv === 3 ? 'Mastered' : lv ? `Level ${lv} of 3 done` : `${countLabel(s)} · new`;
        return `<li><button class="node${up === s ? ' next' : ''}" data-skill="${s.id}"><span class="ring${lv === 3 ? ' full' : ''}" style="--p:${lv / 3}"><span class="core">${!ready ? '+' : lv === 3 ? '✓' : lv + 1}</span></span>
          <span class="nt"><b>${esc(s.title)}</b><small>${state}${d && ready ? ` · <span class="due">${d} due</span>` : ''}</small></span></button></li>`;
      }).join('')}</ol></section>`).join('')}</div>
      <footer class="foot"><span>Progress is saved in this browser only.</span><button class="link" id="reset">Reset progress</button></footer>`;
    const n = $('#go-next'); if (n) n.onclick = () => startLesson(up, lvOf(up) + 1);
    const r = $('#reset');
    r.onclick = () => {
      if (r.dataset.arm) { P = { items: {}, lv: {}, xp: 0, days: [], hooks: P.hooks, custom: P.custom }; save(); go('path'); return; }
      r.dataset.arm = '1'; r.textContent = 'Tap again to erase your progress (pasted texts stay)';
      setTimeout(() => { if (r.isConnected) { delete r.dataset.arm; r.textContent = 'Reset progress'; } }, 4000);
    };
  }

  function viewSkill(sec) {
    const lv = lvOf(sec), ready = usable(sec);
    const custom = sec.type === 'custom' ? `<div class="custom hook"><label for="cust-${sec.id}">${ready ? 'The words' : 'Add the words'}</label>
      <textarea id="cust-${sec.id}" rows="${ready ? 6 : 8}" placeholder="${esc(sec.ask)}">${esc(P.custom[sec.id] || '')}</textarea>
      <small>${esc(sec.ask)} It stays in this browser.</small><div class="row2"><button class="btn pri" id="cust-save">Save the words</button></div></div>` : '';
    app.innerHTML = `<div class="skill"><div><button class="btn ghost" data-go="path">‹ Path</button></div>
      <div><p class="eyebrow">Week ${sec.week}${ready ? ' · ' + countLabel(sec) : ''}</p><h1>${esc(sec.title)}</h1>${sec.tag ? `<p class="hint">${esc(sec.tag)}</p>` : ''}</div>
      ${memoHTML(sec)}
      ${ready ? `<div class="levels">${LEVELS.map(([n, d], k) => `<button class="lvl${k < lv ? ' done' : k === lv ? ' next' : ''}" data-lv="${k + 1}"><span class="ln">LEVEL ${k + 1}${k < lv ? ' · DONE' : ''}</span><b>${n}</b><small>${d}</small></button>`).join('')}</div>
      <div class="row2"><button class="btn gold" data-lv="${Math.min(lv + 1, 3)}">${lv === 3 ? 'Run Master again' : `Start level ${lv + 1}: ${LEVELS[lv][0]}`}</button></div>
      <div class="card"><header class="chead"><h2>The content</h2><span class="cnt">${countLabel(sec)}</span></header><div class="irows">${rowsHTML(sec)}</div>${sec.note ? `<p class="note">${esc(sec.note)}</p>` : ''}</div>
      <div class="hook"><label for="hook-${sec.id}">Your own memory hook</label><textarea id="hook-${sec.id}" rows="2" placeholder="A sentence, picture or story that links them. Hooks you make up yourself stick best.">${esc(P.hooks[sec.id] || '')}</textarea><small>Shows up whenever this skill teaches something new.</small></div>` : ''}
      ${custom}</div>`;
    app.querySelectorAll('[data-lv]').forEach(b => { b.onclick = () => startLesson(sec, +b.dataset.lv); });
    const hk = $(`#hook-${sec.id}`); if (hk) hk.oninput = () => { const v = hk.value.trim(); if (v) P.hooks[sec.id] = v; else delete P.hooks[sec.id]; save(); };
    const cs = $('#cust-save');
    if (cs) cs.onclick = () => { const v = $(`#cust-${sec.id}`).value.trim(); if (v) P.custom[sec.id] = v; else delete P.custom[sec.id]; prep(sec); save(); viewSkill(sec); setTab('skill'); };
  }

  function viewReview() {
    const live = SECTIONS.filter(usable), due = live.reduce((a, s) => a + dueOf(s), 0), seenN = Object.keys(P.items).filter(k => exForKey(k)).length;
    const weak = Object.keys(P.items).filter(k => exForKey(k) && P.items[k].n > 0).sort((a, b) => (P.items[a].c / P.items[a].n) - (P.items[b].c / P.items[b].n) || P.items[a].b - P.items[b].b).slice(0, 8);
    const name = k => { const [id, rest] = k.split(':'), s = BY[id];
      if (s.type === 'table') { const [r, c] = rest.split('.').map(Number); return [s.title, `${s.rows[r].cue}: ${s.rows[r].cells[c]}`]; }
      if (isText(s)) return [s.title, s.lines[parseInt(rest, 10)].text];
      const it = s.items[parseInt(rest, 10)]; return [s.title, rest.endsWith('s') ? `${it.text}: ${it.sub.map(x => x.text).join(', ')}` : `${label(s, parseInt(rest, 10))}. ${it.text}`]; };
    app.innerHTML = `<div class="skill"><div><p class="eyebrow">Spaced review</p><h1>${due ? `${due} due now` : 'Review'}</h1>
      <p class="sub">Everything you have started comes back here on a schedule: missed items right away, then after 10 minutes, an hour, 5 hours, a day and 3 days as you keep getting them right.</p></div>
      ${seenN ? `<div class="row2"><button class="btn gold" id="rv">Start review · ${Math.min(12, Math.max(due, Math.min(8, seenN)))} questions</button></div>` : `<p class="ctx">Nothing to review yet. Finish a Learn level on the path first.</p><div class="row2"><button class="btn gold" data-go="path">Go to the path</button></div>`}
      ${weak.length ? `<div class="card"><header class="chead"><h2>Your weakest items</h2></header><ul class="weak" style="border:0;max-width:none">${weak.map(k => { const [t, x] = name(k); return `<li><small>${esc(t)}</small>${esc(x)}</li>`; }).join('')}</ul></div>` : ''}</div>`;
    const b = $('#rv'); if (b) b.onclick = () => startLesson(null, 0);
  }

  function viewSheet() {
    app.innerHTML = `<section class="phead" style="grid-template-columns:1fr"><div><p class="eyebrow">Weeks 1–5</p><h1>The whole sheet</h1><p class="sub">Read it through, then learn it on the path. Memory sentences and first letters are marked.</p></div></section>
      <div class="sheetgrid">${[1, 2, 3, 4, 5].map(w => `<h3 class="wk">Week ${w}</h3>` + SECTIONS.filter(s => s.week === w).map(s => `<article class="card"><header class="chead"><h2>${esc(s.title)}</h2>${s.tag ? `<span class="tag">${esc(s.tag)}</span>` : ''}<span class="cnt">${usable(s) ? countLabel(s) : 'not added'}</span></header>
        ${s.memo ? `<div style="padding:10px 12px 0">${memoHTML(s)}</div>` : ''}<div class="irows">${usable(s) ? rowsHTML(s) : `<p class="ptext" style="color:var(--muted);font-size:15px">${esc(s.ask)} <button class="link" data-skill="${s.id}">Add it</button></p>`}</div>${s.note ? `<p class="note">${esc(s.note)}</p>` : ''}</article>`).join('')).join('')}</div>`;
  }

  go('path');
})();
</script>

</html>
